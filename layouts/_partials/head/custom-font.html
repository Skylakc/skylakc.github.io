{{- $fonts := slice
    (dict "weight" 300 "file" "fonts/lato-300.woff2")
    (dict "weight" 400 "file" "fonts/lato-400.woff2")
    (dict "weight" 700 "file" "fonts/lato-700.woff2")
-}}
{{- with resources.Get "fonts/lato-400.woff2" -}}
<link rel="preload" href="{{ .RelPermalink }}" as="font" type="font/woff2" crossorigin>
{{- end -}}
<style>
{{- range $fonts -}}
{{- $weight := .weight -}}
{{- with resources.Get .file -}}
@font-face{font-family:"Lato";font-style:normal;font-weight:{{ $weight }};font-display:swap;src:url("{{ .RelPermalink }}") format("woff2")}
{{- end -}}
{{- end -}}
</style>
